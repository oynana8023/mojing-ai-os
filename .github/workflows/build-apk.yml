name: Build Android APP

on:
  workflow_dispatch:  # 允许手动点击打包
  push:
    branches: [ "main", "master" ] # 每次修改代码自动打包

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 准备 APP 资源 (核心修复：打包所有逻辑文件)
        run: |
          mkdir www
          # 把界面、逻辑(js)、样式(css)和技能库全部装进 APP 里
          cp index.html www/
          cp -r js www/ 2>/dev/null || true
          cp -r css www/ 2>/dev/null || true
          cp -r skills www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true
          
          echo '{"appId": "com.mojing.ai.os", "appName": "墨境AI", "webDir": "www", "bundledWebRuntime": false}' > capacitor.config.json

      - name: 安装 Capacitor (跨平台打包核心)
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          
      - name: 生成 Android 工程
        run: |
          npx cap add android
          npx cap sync android

      - name: 修复 Kotlin 依赖冲突并编译 APK
        run: |
          cd android
          cat <<EOF >> build.gradle
          
          subprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 上传 APK 供手机下载
        uses: actions/upload-artifact@v4
        with:
          name: Mojing_AI_OS_安卓安装包
          path: android/app/build/outputs/apk/debug/app-debug.apk
