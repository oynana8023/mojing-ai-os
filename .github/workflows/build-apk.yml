name: Build Mojing AI OS - Commercial Ultra

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          
      - run: |
          # 1. 创建合法的 Android 工程壳子
          flutter create . --project-name mojing_ai_os --platforms android
          
          # 2. 核心修复：强行将 settings.gradle 中的 Kotlin 版本升级到 1.9.24
          sed -i 's/id "org.jetbrains.kotlin.android" version "1.7.10" apply false/id "org.jetbrains.kotlin.android" version "1.9.24" apply false/g' android/settings.gradle
          
          # 3. 拉取依赖并编译
          flutter pub get
          flutter build apk --release
          
      - uses: actions/upload-artifact@v4
        with:
          name: 墨境AI_全息视觉商用版_APK
          path: build/app/outputs/flutter-apk/app-release.apk
